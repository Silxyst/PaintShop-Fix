[ABOUT]
NAME = Paintshop
AUTHOR = x4fab
VERSION = 1.1.4-local.4
DESCRIPTION = Local enhanced edition: editable layers, recoverable drafts, stale recovery cleanup, Paintshop projects and safe saving. Based on x4fab Paintshop 1.1.4.
URL = https://github.com/ac-custom-shaders-patch/app-paintshop

[CORE]
LAZY = 1  ; Do not load script until app is first opened. Makes app pretty much zero cost until it’s used, please use it where possible.
  ; Using partial laziness here (without automatic unload) so that app could prevent unloading if there is unsaved data.

[WINDOW_...]
ID = paintshop
NAME = Paintshop
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowMainSettings
FUNCTION_ON_SHOW = onShowWindowMain
FUNCTION_ON_HIDE = onHideWindowMain
FLAGS = SETTINGS
MIN_SIZE = 250, 400
MAX_SIZE = 250, 1000

[SIM_CALLBACKS]
WORLD_UPDATE = onWorldUpdate

[RENDER_CALLBACKS]
TRANSPARENT = draw3D
