<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Fluxo PaintShop Fix: nova camada, pinte, Ctrl+S, exportar"><title>Do clique à skin nova — o fluxo PaintShop Fix</title><defs><linearGradient id="pcTrack" x1="0" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff4d8d"/><stop offset=".5" stop-color="#ffb020"/><stop offset="1" stop-color="#22c55e"/></linearGradient><filter id="pcSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="1200" height="250" rx="20" fill="#100c14"/><rect width="1200" height="250" rx="20" fill="none" stroke="#4a2c3c"/><circle cx="212" cy="30" r="5" fill="#ff4d8d"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="228" y="35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#9fb2c1">DO CLIQUE À SKIN NOVA — O FLUXO PAINTSHOP FIX</text><text x="1066" y="35" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#22c55e">AO VIVO</text><rect x="70" y="58" width="1060" height="6" rx="3" fill="#2a2130"/><rect x="70" y="58" width="1060" height="6" rx="3" fill="url(#pcTrack)" opacity=".35"/><circle cx="70" cy="61" r="7" fill="#ff4d8d" filter="url(#pcSoft)"><animateMotion path="M0 0 H1060" dur="8s" repeatCount="indefinite"/></circle><circle cx="70" cy="61" r="4" fill="#ffffff"><animateMotion path="M0 0 H1060" dur="8s" repeatCount="indefinite"/></circle><g font-family="Arial, Helvetica, sans-serif"><g opacity="1"><animate attributeName="opacity" values="1;.42;.42;.42;1" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="70" y="90" width="248" height="118" rx="14" fill="#161221" stroke="#ff4d8d" stroke-width="2"/><circle cx="96" cy="114" r="7" fill="#ff4d8d"/><text x="112" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">+ NOVA CAMADA</text><text x="96" y="146" font-size="12" fill="#8fa2b1">Shift+Click na lataria,</text><text x="96" y="164" font-size="12" fill="#8fa2b1">olho e opacidade</text><text x="96" y="190" font-size="11" font-weight="700" fill="#ff4d8d">1 • CRIE</text></g><g opacity=".42"><animate attributeName="opacity" values=".42;1;.42;.42;.42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="342" y="90" width="248" height="118" rx="14" fill="#161221" stroke="#ffb020" stroke-width="2"/><circle cx="368" cy="114" r="7" fill="#ffb020"/><text x="384" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">PINTE</text><text x="368" y="146" font-size="12" fill="#8fa2b1">Pincéis, adesivos,</text><text x="368" y="164" font-size="12" fill="#8fa2b1">simetria e zoom</text><text x="368" y="190" font-size="11" font-weight="700" fill="#ffb020">2 • DESENHE</text></g><g opacity=".42"><animate attributeName="opacity" values=".42;.42;1;.42;.42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="614" y="90" width="248" height="118" rx="14" fill="#161221" stroke="#00d4ff" stroke-width="2"/><circle cx="640" cy="114" r="7" fill="#00d4ff"/><text x="656" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">CTRL+S</text><text x="640" y="146" font-size="12" fill="#8fa2b1">Rascunho + 10 autosaves,</text><text x="640" y="164" font-size="12" fill="#8fa2b1">nada se perde</text><text x="640" y="190" font-size="11" font-weight="700" fill="#00d4ff">3 • SALVE</text></g><g opacity=".42"><animate attributeName="opacity" values=".42;.42;.42;1;.42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="886" y="90" width="248" height="118" rx="14" fill="#161221" stroke="#22c55e" stroke-width="2"/><circle cx="912" cy="114" r="7" fill="#22c55e"/><text x="928" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">EXPORTAR</text><text x="912" y="146" font-size="12" fill="#8fa2b1">Textura final com AO,</text><text x="912" y="164" font-size="12" fill="#8fa2b1">vira skin nova</text><text x="912" y="190" font-size="11" font-weight="700" fill="#22c55e">4 • BRILHE</text></g></g><text x="326" y="162" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#4a3c4c">›</text><text x="598" y="162" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#4a3c4c">›</text><text x="870" y="162" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#4a3c4c">›</text><text x="600" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64798a">.pspaint é o mestre editável • PNG/DDS é a foto final • sempre Exporte</text></svg>